spring.application.name=gestion-polizas

server.port=8080

spring.datasource.url=jdbc:h2:mem:polizasdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Identifiers must not silently truncate fractional JSON numbers.
spring.jackson.deserialization.accept-float-as-int=false

spring.h2.console.enabled=false

app.security.api-key=${API_KEY:}
app.renovacion.ipc-porcentaje=${IPC_PORCENTAJE:5}
app.core.mode=${CORE_MODE:fake}
app.core.base-url=${CORE_BASE_URL:http://localhost:${server.port}}
app.core.connect-timeout=${CORE_CONNECT_TIMEOUT:1s}
app.core.response-timeout=${CORE_RESPONSE_TIMEOUT:2s}

springdoc.packages-to-scan=gestion_polizas.infrastructure.adapters.input.rest.controllers
springdoc.swagger-ui.persist-authorization=false
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
